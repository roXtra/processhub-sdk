name: Create Release

env:
  NODE_VERSION: 24

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@roxtra"
      - name: Install dependencies
        run: npm ci
      - name: Run Format Checker
        run: npm run check:format
        working-directory: ./
        timeout-minutes: 10
      - name: Lint
        run: npm run lint
      - name: Build, Test and Pack
        run: |
          npm run build
          npm run testcoverage
          RELEASENAME=$(npm pack)
          mv $RELEASENAME release.tgz
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: release.tgz
          prerelease: ${{ contains(github.ref, '-') }} # If tag contains -, it's a prerelease (e.g. /refs/tags/v8.30.0-0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Package Registry
        # If tag contains -, it's a prerelease (e.g. /refs/tags/v8.30.0-0) and is published under the "prerelease" dist-tag instead of "latest"
        run: npm publish --tag ${{ contains(github.ref, '-') && 'prerelease' || 'latest' }}
        env: 
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}